[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kk-recovered"
version = "0.2.0"
description = "KK Windows 可执行文件源码还原与 PE 静态分析工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kk-recovered = "kk_recovered.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
